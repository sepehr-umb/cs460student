<html>

<head>
    <style>
        html,
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        var renderer, controls, scene, camera;

        var LASTOBJECT = null;   // the most recently placed torus
        var IS_SCALING = false;  // true between SHIFT-mousedown and mouseup
        var FLICKERING = false;  // toggled with the f key
        var TORUSES = [];        // every torus in the scene
        var WIREFRAME = false;   // toggled with the w key

        window.onload = function () {

            // Three.js code goes here
            scene = new THREE.Scene();

            // setup the camera
            var fov = 75;
            var ratio = window.innerWidth / window.innerHeight;
            var zNear = 1;
            var zFar = 10000;
            camera = new THREE.PerspectiveCamera(fov, ratio, zNear, zFar);
            camera.position.set(0, 0, 100);

            // create renderer and setup the canvas
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            // environment map for reflections
            var pmrem = new THREE.PMREMGenerator(renderer);
            scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;



            // shared geometry + material for every placed torus (hotpink = #FF69B4)
            var pink_geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
            var pink_material = new THREE.MeshStandardMaterial({
                color: 0xff69b4,
                metalness: 1.0,
                roughness: 0.05
            });

            renderer.domElement.onmousedown = function (e) {

                // only place a torus when SHIFT is held
                if (!e.shiftKey) return;

                // stop OrbitControls from rotating while we place
                controls.enabled = false;

                console.log('Yay! We clicked!');

                var pixel_coords = new THREE.Vector2(e.clientX, e.clientY);

                console.log('Pixel coords', pixel_coords);

                var vp_coords = new THREE.Vector2(
                    (pixel_coords.x / window.innerWidth) * 2 - 1,  //X
                    -(pixel_coords.y / window.innerHeight) * 2 + 1) // Y

                console.log('Viewport coords', vp_coords);

                var vp_coords_near = new THREE.Vector3(vp_coords.x, vp_coords.y, 0);


                var raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(vp_coords_near, camera);
                var intersects = raycaster.intersectObject(invisible_plane);

                console.log('Ray to Invisible Plane', intersects[0].point);

                // place a new hotpink torus at the click point
                // clone the material so each torus can change color on its own
                var pink_torus = new THREE.Mesh(pink_geometry, pink_material.clone());
                pink_torus.position.set(intersects[0].point.x, intersects[0].point.y, intersects[0].point.z);
                scene.add(pink_torus);
                TORUSES.push(pink_torus);

                // if flickering is on, the new torus needs transparency too
                if (FLICKERING) {
                    pink_torus.material.transparent = true;
                    pink_torus.material.needsUpdate = true;
                }

                // if wireframe mode is on, the new torus should match
                pink_torus.material.wireframe = WIREFRAME;

                // remember it and start scaling mode
                LASTOBJECT = pink_torus;
                IS_SCALING = true;

            };

            // drag up = bigger, drag down = smaller
            renderer.domElement.onmousemove = function (e) {

                if (!IS_SCALING) return;

                console.log('movementY', e.movementY);

                // movementY is negative when dragging up, so flip the sign
                var DELTA = -e.movementY * 0.01;

                LASTOBJECT.scale.set(
                    LASTOBJECT.scale.x + DELTA,
                    LASTOBJECT.scale.y + DELTA,
                    LASTOBJECT.scale.z + DELTA);

                // flipped (negative scale) = grassgreen, normal = hotpink
                if (LASTOBJECT.scale.x < 0) {
                    LASTOBJECT.material.color.set(0x7cfc00);
                } else {
                    LASTOBJECT.material.color.set(0xff69b4);
                }

            };

            // turn OrbitControls back on and stop scaling once the mouse is released
            renderer.domElement.onmouseup = function (e) {
                IS_SCALING = false;
                controls.enabled = true;
            };


            // setup lights
            var ambientLight = new THREE.AmbientLight();
            scene.add(ambientLight);

            var light = new THREE.DirectionalLight(0xffffff, 5.0);
            light.position.set(10, 100, 10);
            scene.add(light);

            // configure torus knot
            var geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
            var material = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                metalness: 1.0,
                roughness: 0.05
            });

            var knot = new THREE.Mesh(geometry, material);

            scene.add(knot);
            TORUSES.push(knot);



            //
            // The invisible plane
            //
            geometry = new THREE.PlaneGeometry(10000, 10000);
            material = new THREE.MeshBasicMaterial({
                visible: false
            });

            var invisible_plane = new THREE.Mesh(geometry, material);

            scene.add(invisible_plane);
            //
            //
            //



            // interaction
            controls = new OrbitControls(camera, renderer.domElement);

            // f toggles flickering on and off
            window.onkeypress = function (e) {

                if (e.key === 'f') {

                    FLICKERING = !FLICKERING;

                    for (var i = 0; i < TORUSES.length; i++) {
                        var mat = TORUSES[i].material;
                        mat.transparent = FLICKERING;
                        mat.opacity = 1.0;   // reset to solid when turning off
                        mat.needsUpdate = true;
                    }

                } else if (e.key === 'w') {

                    WIREFRAME = !WIREFRAME;

                    for (var i = 0; i < TORUSES.length; i++) {
                        // skip the original white knot, only placed tori
                        if (TORUSES[i] === knot) continue;
                        TORUSES[i].material.wireframe = WIREFRAME;
                    }

                }

            };

            // call animation/rendering loop
            animate();

        };

        function animate() {

            requestAnimationFrame(animate);

            // random opacity for every torus, every frame
            if (FLICKERING) {
                for (var i = 0; i < TORUSES.length; i++) {
                    TORUSES[i].material.opacity = Math.random();
                }
            }

            // and here..
            controls.update();
            renderer.render(scene, camera);

        };
    </script>
</head>

<body></body>

</html>
