    <script id="vertexshader" type="glsl">
      attribute vec3 position;

      uniform mat4 transform;
      uniform float u_pointsize;

      varying vec3 v_pos;

      void main(void) {

        vec4 final_position = transform * vec4( position, 1.);

        gl_Position = final_position;
        v_pos = position;

        // Part 2 + dynamic particle/ball sizing
        gl_PointSize = u_pointsize;

      }
    </script>

    <script id="fragmentshader" type="glsl">
      precision mediump float;

      uniform vec4 color;
      uniform int u_is_point;
      uniform float u_time;

      varying vec3 v_pos;

      void main(void) {
        if (u_is_point == 1) {
          // Render smooth glowing circular points for balls, trails, and particles
          vec2 cxy = 2.0 * gl_PointCoord - 1.0;
          float r = dot(cxy, cxy);
          if (r > 1.0) {
            discard;
          }
          float glow = pow(1.0 - r, 0.65);
          vec3 core = mix(color.rgb, vec3(1.0, 1.0, 1.0), pow(1.0 - r, 2.5) * 0.65);
          gl_FragColor = vec4(core, color.a * glow);
        } else {
          // Subtle neon bevel & pulse on 2D triangles (paddles, bricks, powerups)
          float edge = 1.0 - 0.18 * abs(v_pos.y * 18.0);
          float pulse = 0.94 + 0.06 * sin(u_time * 3.5 + v_pos.x * 8.0);
          gl_FragColor = vec4(color.rgb * edge * pulse, color.a);
        }
      }
    </script>

    <script>
        window.onload = function () {
            //************************************************************//
            //
            // INITIALIZE WEBGL
            //
            c = document.getElementById("c"); // setup canvas
            gl = c.getContext("webgl", { alpha: true, antialias: true }); // setup GL context
            gl.viewport(0, 0, c.width, c.height);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            //************************************************************//
            //
            // SHADERS
            //
            v_shader = gl.createShader(gl.VERTEX_SHADER);
            f_shader = gl.createShader(gl.FRAGMENT_SHADER);

            // compile vertex shader
            gl.shaderSource(
                v_shader,
                document.getElementById("vertexshader").innerText
            );
            gl.compileShader(v_shader);
            if (!gl.getShaderParameter(v_shader, gl.COMPILE_STATUS)) {
                console.log(gl.getShaderInfoLog(v_shader));
            } else {
                console.log("Vertex Shader compiled!");
            }

            // compile fragment shader
            gl.shaderSource(
                f_shader,
                document.getElementById("fragmentshader").innerText
            );
            gl.compileShader(f_shader);
            if (!gl.getShaderParameter(f_shader, gl.COMPILE_STATUS)) {
                console.log(gl.getShaderInfoLog(f_shader));
            } else {
                console.log("Fragment Shader compiled!");
            }

            // attach and link the shaders
            shaderprogram = gl.createProgram();
            gl.attachShader(shaderprogram, v_shader);
            gl.attachShader(shaderprogram, f_shader);

            gl.linkProgram(shaderprogram);

            gl.useProgram(shaderprogram);

            STOPPED = false;
            PADDLE_SCALE = 1.0;
            PADDLE_VEL = 0.0;
            KEYS = { left: false, right: false };

            ACTIVE_BRICK_STATE = 0;
            BRICK_STATES = [[], []];
            FLIP_COUNT = [0, 0];
            IS_FLIPPING = false;
            FLIP_ANGLE = 0;
            FLIP_SWAPPED = false;

            COMBO = 0;
            SHAKE_FRAMES = 0;
            START_TIME = performance.now();

            // Pure WebGL particle, trail, powerup, and multi-ball lists
            PARTICLES = [];
            TRAILS = [];
            POWERUPS = [];
            EXTRA_BALLS = [];
            FIREBALL_TIMER = 0;

            OBJECTS = [];
            OBJECTS.push(createPaddle([0.2, 1.0, 0.85, 1], [0, -0.9, 0])); // BOTTOM PADDLE
            OBJECTS.push(createBall([1, 1, 1, 1], [0, 0, 0])); // BALL

            // Shared single-point buffer for particles and trails
            SHARED_POINT = createBall([1, 1, 1, 1], [0, 0, 0]);

            createBricks(); // ADD BRICKS FOR ACTIVE STATE
            BRICK_STATES[0] = OBJECTS.slice(2);
            BRICK_STATES[1] = generateBrickList();

            resetBall();

            animate();
        };

        function createPaddle(color, offset) {
            //************************************************************//
            //
            // CREATE GEOMETRY
            //
            vertices = new Float32Array([
                -0.1, 0.05, 0.0, // V0      // 0
                -0.1, -0.05, 0.0, // V1, V4  // 1
                0.1, 0.05, 0.0, // V2, V3  // 2
                0.1, -0.05, 0.0  // V5      // 3
            ]);

            indices = new Uint8Array([
                0, 1, 2, // Triangle 1
                2, 1, 3  // Triangle 2
            ]);

            v_buffer = gl.createBuffer(); // create
            gl.bindBuffer(gl.ARRAY_BUFFER, v_buffer); // bind
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW); // put data in
            gl.bindBuffer(gl.ARRAY_BUFFER, null); // unbind

            i_buffer = gl.createBuffer(); // create
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, i_buffer); // bind
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW); // put data in
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null); // unbind

            return [v_buffer, i_buffer, color, offset, 6, gl.TRIANGLES];
        }

        function createBall(color, offset) {
            vertices = new Float32Array([
                0.0, 0.0, 0.0
            ]);

            indices = new Uint8Array([0]);

            v_buffer = gl.createBuffer(); // create
            gl.bindBuffer(gl.ARRAY_BUFFER, v_buffer); // bind
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW); // put data in
            gl.bindBuffer(gl.ARRAY_BUFFER, null); // unbind

            i_buffer = gl.createBuffer(); // create
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, i_buffer); // bind
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW); // put data in
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null); // unbind

            return [v_buffer, i_buffer, color, offset, 1, gl.POINTS];
        }

        function createBrick(color, offset, score, half_w, half_h) {
            //************************************************************//
            //
            // CREATE GEOMETRY
            //
            half_w = half_w || 0.095;
            half_h = half_h || 0.05;

            vertices = new Float32Array([
                -half_w, half_h, 0.0,  // V0      // 0
                -half_w, -half_h, 0.0, // V1, V4  // 1
                half_w, half_h, 0.0,   // V2, V3  // 2
                half_w, -half_h, 0.0,  // V5      // 3
            ]);

            indices = new Uint8Array([
                0, 1, 2, // Triangle 1
                2, 1, 3, // Triangle 2
            ]);

            v_buffer = gl.createBuffer(); // create
            gl.bindBuffer(gl.ARRAY_BUFFER, v_buffer); // bind
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW); // put data in
            gl.bindBuffer(gl.ARRAY_BUFFER, null); // unbind

            i_buffer = gl.createBuffer(); // create
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, i_buffer); // bind
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW); // put data in
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null); // unbind

            return [v_buffer, i_buffer, color.slice(), offset, 6, gl.TRIANGLES, score, half_w, half_h];
        }

        function generateBrickList() {
            var list = [];
            var S = [0.048, 0.032]; // Small brick (half_w, half_h)
            var M = [0.096, 0.038]; // Medium brick
            var L = [0.144, 0.042]; // Large brick

            // 6 full-width rows in a mirror-symmetrical pattern using 3 brick sizes
            var pattern = [
                [L, M, S, M, L, M, S, M, L],
                [M, L, S, L, S, L, S, L, M],
                [S, M, L, S, M, S, M, S, L, M, S],
                [S, M, L, S, M, S, M, S, L, M, S],
                [M, L, S, L, S, L, S, L, M],
                [L, M, S, M, L, M, S, M, L],
            ];

            color = [
                [1.0, 0.15, 0.35, 1], // Row 0: Neon Crimson
                [1.0, 0.55, 0.05, 1], // Row 1: Cyber Orange
                [1.0, 0.92, 0.1, 1],  // Row 2: Electric Gold
                [0.1, 1.0, 0.45, 1],  // Row 3: Matrix Green
                [0.05, 0.85, 1.0, 1], // Row 4: Laser Cyan
                [0.75, 0.3, 1.0, 1],  // Row 5: Synthwave Violet
            ];

            var gap = 0.012;
            offset_y = 0.88;

            for (let i = 0; i < pattern.length; i++) {
                var row = pattern[i];
                var total_width = 0;
                for (let j = 0; j < row.length; j++) {
                    total_width += row[j][0] * 2;
                }
                total_width += (row.length - 1) * gap;

                offset_x = -total_width / 2;
                for (let j = 0; j < row.length; j++) {
                    var half_w = row[j][0];
                    var half_h = row[j][1];
                    offset_x += half_w;
                    list.push(createBrick(color[i], [offset_x, offset_y, 0], 6 - i, half_w, half_h));
                    offset_x += half_w + gap;
                }
                offset_y -= 0.11;
            }
            return list;
        }

        function createBricks() {
            var new_bricks = generateBrickList();
            for (let i = 0; i < new_bricks.length; i++) {
                OBJECTS.push(new_bricks[i]);
            }
        }

        function spawnParticles(x, y, baseColor, count) {
            for (var i = 0; i < count; i++) {
                var angle = Math.random() * Math.PI * 2;
                var speed = 0.004 + Math.random() * 0.018;
                PARTICLES.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: [baseColor[0], baseColor[1], baseColor[2], 1.0],
                    size: 4.0 + Math.random() * 6.0,
                    life: 1.0
                });
            }
        }

        function maybeSpawnPowerup(x, y) {
            if (Math.random() < 0.22) {
                // 0: Multi-Ball (Cyan), 1: Fireball Pierce (Gold), 2: Mega Paddle (Green)
                var type = Math.floor(Math.random() * 3);
                var pColor = type === 0 ? [0.0, 0.95, 1.0, 1.0] : (type === 1 ? [1.0, 0.85, 0.1, 1.0] : [0.2, 1.0, 0.4, 1.0]);
                var geom = createBrick(pColor, [x, y, 0], 0, 0.032, 0.018);
                geom.push(type);
                POWERUPS.push(geom);
            }
        }

        function updateDimensionBadge() {
            var badge = document.getElementById("dimension_badge");
            var mirrored = (FLIP_COUNT[ACTIVE_BRICK_STATE] % 2 === 1) ? " [MIRRORED]" : "";
            badge.innerText = "DIMENSION " + (ACTIVE_BRICK_STATE + 1) + mirrored +
                (FIREBALL_TIMER > 0 ? " ★ PIERCE BALL ★" : "");
        }

        function drawWebGLObject(v_buffer, i_buffer, COLOR, offset_x, offset_y, scale_x, scale_y, VERTEXCOUNT, PRIMITIVE, pointSize) {
            gl.bindBuffer(gl.ARRAY_BUFFER, v_buffer);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, i_buffer);

            var a_position = gl.getAttribLocation(shaderprogram, "position");
            gl.vertexAttribPointer(a_position, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(a_position);

            var u_color = gl.getUniformLocation(shaderprogram, "color");
            gl.uniform4fv(u_color, new Float32Array(COLOR));

            var u_pointsize = gl.getUniformLocation(shaderprogram, "u_pointsize");
            gl.uniform1f(u_pointsize, pointSize || 10.0);

            var u_is_point = gl.getUniformLocation(shaderprogram, "u_is_point");
            gl.uniform1i(u_is_point, PRIMITIVE === gl.POINTS ? 1 : 0);

            var u_transform = gl.getUniformLocation(shaderprogram, "transform");
            var current_transform = new Float32Array([
                scale_x, 0, 0, 0,
                0, scale_y, 0, 0,
                0, 0, 1, 0,
                offset_x, offset_y, 0, 1,
            ]);
            gl.uniformMatrix4fv(u_transform, false, current_transform);

            gl.drawElements(PRIMITIVE, VERTEXCOUNT, gl.UNSIGNED_BYTE, 0);
        }

        function animate() {
            if (STOPPED) {
                return;
            }

            requestAnimationFrame(animate);

            var elapsed = (performance.now() - START_TIME) * 0.001;
            var u_time = gl.getUniformLocation(shaderprogram, "u_time");
            gl.uniform1f(u_time, elapsed);

            // Tight, instant-stop 60fps paddle control
            var half_width = 0.1 * PADDLE_SCALE;
            if (KEYS.left && !KEYS.right) {
                PADDLE_VEL = -0.022;
            } else if (KEYS.right && !KEYS.left) {
                PADDLE_VEL = 0.022;
            } else {
                PADDLE_VEL = 0.0;
            }
            OBJECTS[0][3][0] = Math.max(-1.0 + half_width, Math.min(1.0 - half_width, OBJECTS[0][3][0] + PADDLE_VEL));

            // CLEAR NOW BEFORE ANY DRAWING
            gl.clearColor(0.02, 0.01, 0.05, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            // Screen-shake offset on heavy combo hits
            var shake_x = 0, shake_y = 0;
            if (SHAKE_FRAMES > 0) {
                shake_x = (Math.random() - 0.5) * 0.018;
                shake_y = (Math.random() - 0.5) * 0.018;
                SHAKE_FRAMES--;
            }

            // 90-degree 2D edge-on flip animation every 100 points
            if (IS_FLIPPING) {
                FLIP_ANGLE += 0.055;
                if (FLIP_ANGLE >= Math.PI / 2 && !FLIP_SWAPPED) {
                    FLIP_SWAPPED = true;
                    // Save outgoing bricks and mirror their X coordinates for their next appearance
                    var outgoing = OBJECTS.slice(2);
                    for (var k = 0; k < outgoing.length; k++) {
                        outgoing[k][3][0] = -outgoing[k][3][0];
                    }
                    BRICK_STATES[ACTIVE_BRICK_STATE] = outgoing;
                    FLIP_COUNT[ACTIVE_BRICK_STATE]++;

                    // Swap to the other brick state
                    ACTIVE_BRICK_STATE = 1 - ACTIVE_BRICK_STATE;
                    OBJECTS.splice(2, OBJECTS.length - 2, ...BRICK_STATES[ACTIVE_BRICK_STATE]);
                    updateDimensionBadge();
                }
                if (FLIP_ANGLE >= Math.PI) {
                    FLIP_ANGLE = 0;
                    IS_FLIPPING = false;
                    FLIP_SWAPPED = false;
                    document.getElementById("flip_banner").style.opacity = 0;
                    document.getElementById("flip_banner").style.transform = "translate(-50%, -50%) scale(0.8)";
                }
            } else {
                updateBall();
            }

            if (FIREBALL_TIMER > 0) {
                FIREBALL_TIMER--;
                if (FIREBALL_TIMER === 0) updateDimensionBadge();
            }

            var brick_flip_scale = IS_FLIPPING ? Math.abs(Math.cos(FLIP_ANGLE)) : 1.0;

            // 1. Draw glowing ball comet trails (plain WebGL gl.POINTS)
            for (var t = TRAILS.length - 1; t >= 0; t--) {
                var tr = TRAILS[t];
                tr.life -= 0.07;
                if (tr.life <= 0) {
                    TRAILS.splice(t, 1);
                    continue;
                }
                var trailColor = FIREBALL_TIMER > 0
                    ? [1.0, 0.55, 0.05, tr.life * 0.65]
                    : [0.0, 0.9, 1.0, tr.life * 0.55];
                drawWebGLObject(
                    SHARED_POINT[0], SHARED_POINT[1],
                    trailColor,
                    tr.x + shake_x, tr.y + shake_y,
                    1, 1, 1, gl.POINTS, 9.0 * tr.life
                );
            }

            // 2. Draw main OBJECTS (Paddle, Main Ball, and Active Bricks)
            for (var o = 0; o < OBJECTS.length; o++) {
                var current = OBJECTS[o];
                var v_buffer = current[0];
                var i_buffer = current[1];
                var COLOR = current[2];
                var OFFSET = current[3];
                var VERTEXCOUNT = current[4];
                var PRIMITIVE = current[5];

                var scale_x = (o == 0) ? PADDLE_SCALE : ((o >= 2) ? brick_flip_scale : 1);
                var offset_x = ((o >= 2) ? OFFSET[0] * brick_flip_scale : OFFSET[0]) + shake_x;
                var offset_y = OFFSET[1] + shake_y;

                var drawColor = COLOR;
                if (o == 1 && FIREBALL_TIMER > 0) {
                    drawColor = [1.0, 0.85, 0.1, 1.0];
                }

                drawWebGLObject(v_buffer, i_buffer, drawColor, offset_x, offset_y, scale_x, 1, VERTEXCOUNT, PRIMITIVE, 11.0);
            }

            // 3. Draw Extra Multi-Balls
            for (var eb = 0; eb < EXTRA_BALLS.length; eb++) {
                var b = EXTRA_BALLS[eb];
                drawWebGLObject(
                    SHARED_POINT[0], SHARED_POINT[1],
                    [0.3, 1.0, 0.95, 1.0],
                    b.x + shake_x, b.y + shake_y,
                    1, 1, 1, gl.POINTS, 10.0
                );
            }

            // 4. Update & Draw Falling Powerup Capsules
            var paddle_x = OBJECTS[0][3][0];
            var paddle_hw = 0.1 * PADDLE_SCALE;
            for (var p = POWERUPS.length - 1; p >= 0; p--) {
                var pw = POWERUPS[p];
                pw[3][1] -= 0.008;
                drawWebGLObject(pw[0], pw[1], pw[2], pw[3][0] + shake_x, pw[3][1] + shake_y, 1, 1, pw[4], pw[5], 8.0);

                // Check paddle catch
                if (pw[3][1] <= -0.85 && pw[3][1] >= -0.95 &&
                    pw[3][0] >= paddle_x - paddle_hw - 0.03 && pw[3][0] <= paddle_x + paddle_hw + 0.03) {
                    var pType = pw[9];
                    playSound("brick_sound");
                    spawnParticles(pw[3][0], pw[3][1], pw[2], 18);
                    if (pType === 0) {
                        // Spawn 2 extra multi-balls
                        EXTRA_BALLS.push({ x: OBJECTS[1][3][0], y: OBJECTS[1][3][1], dir: Math.PI / 3 });
                        EXTRA_BALLS.push({ x: OBJECTS[1][3][0], y: OBJECTS[1][3][1], dir: 2 * Math.PI / 3 });
                    } else if (pType === 1) {
                        // Fireball pierce mode for 6 seconds
                        FIREBALL_TIMER = 360;
                        updateDimensionBadge();
                    } else {
                        // Instant +35% paddle boost
                        PADDLE_SCALE += 0.35;
                    }
                    POWERUPS.splice(p, 1);
                } else if (pw[3][1] < -1.05) {
                    POWERUPS.splice(p, 1);
                }
            }

            // 5. Update & Draw WebGL Particle Bursts
            for (var k = PARTICLES.length - 1; k >= 0; k--) {
                var pt = PARTICLES[k];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.vy -= 0.00035; // subtle gravity
                pt.life -= 0.025;
                if (pt.life <= 0) {
                    PARTICLES.splice(k, 1);
                    continue;
                }
                pt.color[3] = pt.life;
                drawWebGLObject(
                    SHARED_POINT[0], SHARED_POINT[1],
                    pt.color,
                    pt.x + shake_x, pt.y + shake_y,
                    1, 1, 1, gl.POINTS, pt.size * pt.life
                );
            }
        }

        function resetBall() {
            OBJECTS[1][3][0] = (Math.random() - 0.5) * 0.15; // SET TO CENTER
            OBJECTS[1][3][1] = 0.0;

            BALLDIRECTION = -(Math.PI / 4 + Math.random() * (Math.PI / 2));
            BALLSPEED = 0.005;
            EXTRA_BALLS = [];
            COMBO = 0;
            updateComboHUD();
        }

        function updateComboHUD() {
            var badge = document.getElementById("combo_badge");
            if (COMBO >= 2) {
                badge.innerText = COMBO + "x COMBO!";
                badge.style.opacity = 1;
                badge.style.transform = "scale(1.15)";
                setTimeout(function () {
                    badge.style.transform = "scale(1.0)";
                }, 120);
            } else {
                badge.style.opacity = 0;
            }
        }

        function score(score_value) {
            var old_score = parseInt(document.getElementById("score").innerText);
            var multiplier = Math.min(4, 1 + Math.floor(COMBO / 3));
            var new_score = old_score + score_value * multiplier;
            document.getElementById("score").innerText = new_score;
            if (OBJECTS.length == 2) { // IF ALL BRICKS DESTROYED CREATE MORE
                createBricks();
                BRICK_STATES[ACTIVE_BRICK_STATE] = OBJECTS.slice(2);
            }
            if (Math.floor(new_score / 100) > Math.floor(old_score / 100)) {
                IS_FLIPPING = true;
                FLIP_ANGLE = 0;
                FLIP_SWAPPED = false;
                var banner = document.getElementById("flip_banner");
                banner.style.opacity = 1;
                banner.style.transform = "translate(-50%, -50%) scale(1.05)";
            }
        }

        function playSound(id) {
            var sound = document.getElementById(id);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(function () {});
            }
        }

        function loseLife() {
            var old_life = document.getElementById("lives").innerText;
            document.getElementById("lives").innerText = parseInt(old_life) - 1;
            if (old_life == 1) {
                STOPPED = true;
                var bgm = document.getElementById("bgm_sound");
                if (bgm) bgm.pause();
                playSound("game_over_sound");
                document.getElementById("overlay").style.display = "block";
                document.getElementById("game_over").style.display = "block";
            } else {
                playSound("lose_life_sound");
            }
        }

        function stepSingleBall(ballPos, dir, speed, isMainBall) {
            var BALL_X = ballPos[0];
            var BALL_Y = ballPos[1];

            var BOTTOM_PADDLE_X = OBJECTS[0][3][0];
            var BOTTOM_PADDLE_WIDTH = 0.2 * PADDLE_SCALE;

            TRAILS.push({ x: BALL_X, y: BALL_Y, life: 1.0 });

            if (BALL_X >= 0.96) {
                BALL_X = 0.96;
                dir = Math.PI - dir;
                playSound("bounce_sound");
                spawnParticles(BALL_X, BALL_Y, [0.4, 0.9, 1.0, 1.0], 6);
            } else if (BALL_X <= -0.96) {
                BALL_X = -0.96;
                dir = Math.PI - dir;
                playSound("bounce_sound");
                spawnParticles(BALL_X, BALL_Y, [0.4, 0.9, 1.0, 1.0], 6);
            } else if (BALL_Y >= 0.96) {
                BALL_Y = 0.96;
                dir = -dir;
                playSound("bounce_sound");
                spawnParticles(BALL_X, BALL_Y, [0.4, 0.9, 1.0, 1.0], 6);
            } else if (BALL_Y >= 0.15) {
                // TOP BRICKS
                for (let i = 2; i < OBJECTS.length; i++) {
                    var BRICK_OFFSET_X = OBJECTS[i][3][0];
                    var BRICK_OFFSET_Y = OBJECTS[i][3][1];
                    var BRICK_HALF_W = OBJECTS[i][7] || 0.095;
                    var BRICK_HALF_H = OBJECTS[i][8] || 0.05;
                    if (BALL_X > BRICK_OFFSET_X - BRICK_HALF_W &&
                        BALL_X < BRICK_OFFSET_X + BRICK_HALF_W &&
                        BALL_Y > BRICK_OFFSET_Y - BRICK_HALF_H &&
                        BALL_Y < BRICK_OFFSET_Y + BRICK_HALF_H) {
                        if (FIREBALL_TIMER <= 0) {
                            dir = -dir;
                        }
                        var brickColor = OBJECTS[i][2];
                        var score_num = OBJECTS[i][6];
                        spawnParticles(BRICK_OFFSET_X, BRICK_OFFSET_Y, brickColor, 16);
                        maybeSpawnPowerup(BRICK_OFFSET_X, BRICK_OFFSET_Y);
                        OBJECTS.splice(i, 1);
                        COMBO++;
                        updateComboHUD();
                        SHAKE_FRAMES = Math.min(8, 2 + COMBO);
                        score(score_num);
                        playSound("brick_sound");
                        PADDLE_SCALE += 0.08;
                        break;
                    }
                }
            } else if (BALL_Y <= -0.85) {
                var BOTTOM_PADDLE_LEFT = BOTTOM_PADDLE_X - BOTTOM_PADDLE_WIDTH / 2;
                var BOTTOM_PADDLE_RIGHT = BOTTOM_PADDLE_X + BOTTOM_PADDLE_WIDTH / 2;

                if (BALL_X >= BOTTOM_PADDLE_LEFT && BALL_X <= BOTTOM_PADDLE_RIGHT) {
                    // Steer reflection angle slightly based on where ball hits the paddle
                    var hitFactor = (BALL_X - BOTTOM_PADDLE_X) / (BOTTOM_PADDLE_WIDTH / 2);
                    dir = (Math.PI / 2) - hitFactor * (Math.PI / 3.2);
                    BALL_Y = -0.849;
                    playSound("bounce_sound");
                    spawnParticles(BALL_X, -0.88, [0.2, 1.0, 0.85, 1.0], 10);

                    if (isMainBall) {
                        // SHRINK BY 30% OF TOTAL GROWTH ABOVE ORIGINAL SIZE (1.0)
                        PADDLE_SCALE = Math.max(1.0, PADDLE_SCALE - 0.3 * (PADDLE_SCALE - 1.0));
                        BALLSPEED = Math.min(0.025, BALLSPEED + 0.0002);
                    }
                } else {
                    return { lost: true };
                }
            }

            ballPos[0] = BALL_X + Math.cos(dir) * speed;
            ballPos[1] = BALL_Y + Math.sin(dir) * speed;
            return { lost: false, dir: dir };
        }

        function updateBall() {
            var res = stepSingleBall(OBJECTS[1][3], BALLDIRECTION, BALLSPEED, true);
            if (res.lost) {
                if (EXTRA_BALLS.length > 0) {
                    // Promote an extra ball to main ball instead of losing a life!
                    var promoted = EXTRA_BALLS.pop();
                    OBJECTS[1][3][0] = promoted.x;
                    OBJECTS[1][3][1] = promoted.y;
                    BALLDIRECTION = promoted.dir;
                } else {
                    loseLife();
                    resetBall();
                    return;
                }
            } else {
                BALLDIRECTION = res.dir;
            }

            // Step any active multi-balls
            for (var i = EXTRA_BALLS.length - 1; i >= 0; i--) {
                var eb = EXTRA_BALLS[i];
                var pos = [eb.x, eb.y];
                var ebRes = stepSingleBall(pos, eb.dir, BALLSPEED, false);
                if (ebRes.lost) {
                    EXTRA_BALLS.splice(i, 1);
                } else {
                    eb.x = pos[0];
                    eb.y = pos[1];
                    eb.dir = ebRes.dir;
                }
            }

            // INCREASE BALL SPEED WITH TIME UP TO 0.025
            BALLSPEED = Math.min(0.025, BALLSPEED + 0.000001);
        }

        window.onkeydown = function (e) {
            if (STOPPED) {
                window.location.reload();
            }
            var bgm = document.getElementById("bgm_sound");
            if (bgm && bgm.paused) {
                bgm.play().catch(function () {});
            }
            if (e.key == "ArrowLeft" || e.key == "a" || e.key == "A") {
                KEYS.left = true;
            } else if (e.key == "ArrowRight" || e.key == "d" || e.key == "D") {
                KEYS.right = true;
            }
        };

        window.onkeyup = function (e) {
            if (e.key == "ArrowLeft" || e.key == "a" || e.key == "A") {
                KEYS.left = false;
            } else if (e.key == "ArrowRight" || e.key == "d" || e.key == "D") {
                KEYS.right = false;
            }
        };
    </script>
</head>
